server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000/api/;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
